<!DOCTYPE html>
<html>
<head>
	<title>TicTacToe</title>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script type="text/javascript" src="script.js"></script>
	<script type="text/javascript" src="jquery-3.4.1.min.js"></script>
</head>
<body>
	<h1>TicTacToe</h1>
	<div id="ttt">
		<div class="big">
			<div class="small unused one"></div>
			<div class="small unused four"></div>
			<div class="small unused seven"></div>
		</div>
		<div class="big">
			<div class="small unused two"></div>
			<div class="small unused five"></div>
			<div class="small unused eight"></div>
		</div>
		<div class="big">
			<div class="small unused three"></div>
			<div class="small unused six"></div>
			<div class="small unused nine"></div>
		</div>
	</div>
	<button onclick="alert('Congratulations! You have won!')">I have won!</button>
	<script type="text/javascript" src="script.js"></script>
</body>
</html>
