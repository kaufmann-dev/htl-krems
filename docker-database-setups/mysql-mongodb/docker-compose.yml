version: '3.8'

services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql_matura_container
    environment:
      MYSQL_ROOT_PASSWORD: insy
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:6.0
    container_name: mongodb_matura_container
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
