<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Wiederholung</title>
	<style type="text/css">
		div.a
		{
			width: 70%;
			border: 6px solid black;
			margin: 20px auto;
			padding-top: 200px;
			padding-bottom: 200px;
			background-color: #7777FF;
		}
		th
		{
			padding: 30px;
			border: 3px solid black;
			font-size: 50px;
		}
		td
		{
			padding: 30px;
			border: 3px solid black;
			text-align: center;
			font-size: 30px;	
		}
		table.a
		{
			background-image: url("muster.jpg");
			margin: 0px auto;
			width: 70%;
			border: 3px solid black;
			border-collapse: collapse;
		}
	</style>
</head>
<body>
	<div class="a">
		<table class="a">
			<tr>
				<th colspan="2">Urkunde</th>
			</tr>
			<tr>
				<td>Max</td>
				<td>Muster</td>
			</tr>
			<tr>
				<th colspan="2"><img src="stern.png" alt="stern.png" width="30%"></th>
			</tr>
		</table>
	</div>
</body>
</html>
