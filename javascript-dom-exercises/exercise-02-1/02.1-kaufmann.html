<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Rechner</title>
	<style>
		* {
			font-family: 'Verdana';
		}
		div#form {
			width: 50%;
			padding: 10px;
			margin: 10px auto;
			display: flex;
			flex-direction: column;
		}
		button {
			padding: 10px;
			flex: 1;
		}
		button:not(:last-child) {
			margin-right: 5px;
		}
		label, input {
			display: block;
		}
		input {
			margin-bottom: 10px;
			padding: 5px;
		}
		label {
			margin-bottom: 5px;
		}
		div#buttons {
			display: flex;
			flex-direction: row;
		}
		output {
			padding: 10px;
			box-shadow: 0px 0px 20px 0px rgba(0,0,0,0.15);
			border-radius: 3px;
			margin-bottom: 10px;
		}
		span {
			color: #AAA;
		}
	</style>
</head>
<body>
	<div id="form">
		<label>Zahl 1</label>
		<input id="zahl1" autocomplete="off"></input>
		<label>Zahl 2</label>
		<input id="zahl2" autocomplete="off"></input>
		<label>Ergbenis</label>
		<output id="out"><span>Ergebnis</span></output>
		<div id="buttons">
			<button id="add">Addition</button>
			<button id="sub">Subtraktion</button>
			<button id="mul">Multiplikation</button>
			<button id="div">Division</button>
		</div>
	</div>
	<script type="text/javascript">
		document.getElementById("add").addEventListener("click", function(){
			let z1 = parseInt(document.getElementById("zahl1").value, 10);
			let z2 = parseInt(document.getElementById("zahl2").value, 10);
			let ergebnis;
			if (isNaN(z1) || isNaN(z2)) {
				ergebnis = "Die Eingabewerte sind falsch!";
			}
			else {
				ergebnis = z1 + z2;
			}
			document.getElementById("out").innerText = ergebnis;
		});
		document.getElementById("sub").addEventListener("click", function(){
			let z1 = parseInt(document.getElementById("zahl1").value, 10);
			let z2 = parseInt(document.getElementById("zahl2").value, 10);
			let ergebnis;
			if (isNaN(z1) || isNaN(z2)) {
				ergebnis = "Die Eingabewerte sind falsch!";
			}
			else {
				ergebnis = z1 - z2;
			}
			document.getElementById("out").innerText = ergebnis;
		});
		document.getElementById("mul").addEventListener("click", function(){
			let z1 = parseInt(document.getElementById("zahl1").value, 10);
			let z2 = parseInt(document.getElementById("zahl2").value, 10);
			let ergebnis;
			if (isNaN(z1) || isNaN(z2)) {
				ergebnis = "Die Eingabewerte sind falsch!";
			}
			else {
				ergebnis = z1 * z2;
			}
			document.getElementById("out").innerText = ergebnis;
		});
		document.getElementById("div").addEventListener("click", function(){
			let z1 = parseInt(document.getElementById("zahl1").value, 10);
			let z2 = parseInt(document.getElementById("zahl2").value, 10);
			let ergebnis;
			if (isNaN(z1) || isNaN(z2)) {
				ergebnis = "Die Eingabewerte sind falsch!";
			}
			else {
				ergebnis = z1 / z2;
			}
			document.getElementById("out").innerText = ergebnis;
		});
	</script>
</body>
</html>
