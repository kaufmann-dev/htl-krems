<!DOCTYPE html>
<html>
<head>
	<title>Draääaeieeaasdsadäsaädsaädäsaögh</title>
	<meta charset="utf-8">
	<script type="text/javascript">
		document.addEventListener("DOMContentLoaded", function(){
			document.getElementById("hao").addEventListener("click", function(){
				var ul = document.getElementById("list");
				var li = document.createElement("li");
				li.innerText="New item";
				ul.appendChild(li);
			});
		});
	</script>
</head>
<body>
	<ul id="list">
		<li>Original item</li>
	</ul>
	<button id="hao">Mach neue Dingse da</button>
</body>
</html>
