<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</head>
<body class="container">
    <h2>Anmeldeformular</h2>
    <div>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name">
        </div>
        <button id="sub" class="btn btn-primary">Speichern</button>
    </div>

    <h2 style="margin-top: 30px">Aktuelle Anmeldungen</h2>
    <ul id="lst">
        <li>Anton Poster</li>
        <li>Franz Klammer</li>
        <li>Thomas Muster</li>
    </ul>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function(){
            $("#sub").click(function() {
                var name = $(this).parent().find('#name').val();
                $.post({
                    url: "http://htl.boxtree.at/medw4/api/event.php?name="+name,
                    method: 'POST',
                    data: { name : "name2" },
                    statusCode: {
                        200: function() {
                            $('#lst').append('<li>'+name+'</li>');
                        },
                        404: function() {
                            alert("ERROR: Couldn't add "+name+" to list!");
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
